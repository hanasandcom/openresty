services:
  mc-router:
    image: hanasand-mc-router:1.47.1
    build:
      context: .
      dockerfile: Dockerfile.mc-router
    container_name: minecraft-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:25566:25565"
      - "127.0.0.1:25567:25567"
    environment:
      RECEIVE_PROXY_PROTOCOL: "true"
      CONNECTION_RATE_LIMIT: "20"
      ROUTES_CONFIG: /var/run/vm-routes/minecraft.json
      ROUTES_CONFIG_WATCH: "true"
      API_BINDING: "0.0.0.0:25567"
    volumes:
      - ./runtime:/var/run/vm-routes:ro
    networks:
      - name-pending
      - create
      - cobbleverse
    mem_limit: 128m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "/bin/busybox", "nc", "-z", "-w", "3", "127.0.0.1", "25565"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  name-pending:
    external: true
    name: name_pending_server_default
  create:
    external: true
    name: 67_default
  cobbleverse:
    external: true
    name: cobbleverse_default
