services:
  mc-router:
    image: hanasand-mc-router:1.47.1
    build:
      context: .
      dockerfile: Dockerfile.mc-router
    container_name: minecraft-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:25566:25565"
    environment:
      RECEIVE_PROXY_PROTOCOL: "true"
      CONNECTION_RATE_LIMIT: "20"
      MAPPING: |
        name-pending.hanasand.com=name_pending_server:25565
        np.hanasand.com=name_pending_server:25565
        67.hanasand.com=create-server:25565
        cobbleverse.hanasand.com=cobbleverse:25565
    networks:
      - name-pending
      - create
      - cobbleverse
    mem_limit: 128m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "/bin/busybox", "nc", "-z", "-w", "3", "127.0.0.1", "25565"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  name-pending:
    external: true
    name: name_pending_server_default
  create:
    external: true
    name: 67_default
  cobbleverse:
    external: true
    name: cobbleverse_default
