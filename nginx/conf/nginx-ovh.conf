worker_processes auto;
pid /tmp/openresty.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name hanasand.com *.hanasand.com pengeflyt.com *.pengeflyt.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name hanasand.com *.hanasand.com;
        ssl_certificate /etc/letsencrypt/live/hanasand.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hanasand.com/privkey.pem;
        include /usr/local/openresty/nginx/conf/snippets/ovh-tunnel-proxy.conf;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name pengeflyt.com *.pengeflyt.com;
        ssl_certificate /etc/letsencrypt/live/pengeflyt.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pengeflyt.com/privkey.pem;
        include /usr/local/openresty/nginx/conf/snippets/ovh-tunnel-proxy.conf;
    }
}
