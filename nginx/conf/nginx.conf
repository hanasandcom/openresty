worker_processes auto;
worker_cpu_affinity auto;
pid /tmp/openresty.pid;
error_log /dev/stderr;
env VM_PORT_ROUTE_TOKEN;
env VM_PORT_ROUTES_API_URL;
env VM_MINECRAFT_ROUTES_PATH;

events {
    worker_connections 8192;
    multi_accept on;
}

# TLS, SSH, Minecraft and HTTP signaling share the public TCP listener.
# PROXY preserves client IPs; the internal SSH listener consumes the header before sshd.
stream {
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";
    lua_shared_dict vm_route_targets 1m;
    lua_add_variable $tls_route_proxy;
    lua_add_variable $vm_route_backend;
    init_worker_by_lua_file /usr/local/openresty/nginx/lua/vm_port_routes.lua;
    lua_add_variable $plain_http;
    lua_add_variable $ssh;
    map $plain_http $non_tls_backend {
        "1" 127.0.0.1:8444;
        default 127.0.0.1:25566;
    }
    map $ssl_preread_server_name $tls_backend {
        turn.hanasand.com 127.0.0.1:5348;
        default 127.0.0.1:8443;
    }
    map $ssh $non_tls_backend_or_ssh {
        "1" 127.0.0.1:22443;
        default $non_tls_backend;
    }
    map $ssl_preread_protocol $shared_backend {
        ""      $non_tls_backend_or_ssh;
        default $tls_backend;
    }
    map $tls_route_proxy $vm_shared_backend {
        ""      $shared_backend;
        default $tls_route_proxy;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        preread_by_lua_block {
            local sock = assert(ngx.req.socket())
            local prefix = sock:peek(4)
            if prefix == "SSH-" then
                ngx.var.ssh = "1"
            elseif prefix == "GET " or prefix == "POST" then
                ngx.var.plain_http = "1"
            end
            local serverName = ngx.var.ssl_preread_server_name
            if serverName and string.lower(serverName) ~= "turn.hanasand.com" then
                local backend = ngx.shared.vm_route_targets:get(string.lower(serverName))
                if backend then ngx.var.tls_route_proxy = "127.0.0.1:24444" end
            end
        }
        preread_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_protocol on;
        proxy_pass $vm_shared_backend;
    }

    # Remove the internal PROXY header before handing end-to-end TLS to a VM.
    server {
        listen 127.0.0.1:24444 proxy_protocol;
        ssl_preread on;
        preread_by_lua_block {
            local serverName = ngx.var.ssl_preread_server_name
            local backend = serverName and ngx.shared.vm_route_targets:get(string.lower(serverName))
            if not backend then ngx.exit(ngx.ERROR) end
            ngx.var.vm_route_backend = backend
        }
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass $vm_route_backend;
    }

    # Consume the front listener's PROXY header, then pass SSH bytes to the
    # VM gateway without a header that OpenSSH cannot parse.
    server {
        listen 127.0.0.1:22443 proxy_protocol;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass 127.0.0.1:22;
    }
}

http {
    lua_shared_dict vm_http_routes 1m;
    init_worker_by_lua_file /usr/local/openresty/nginx/lua/vm_http_routes.lua;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;
    lua_package_path "/usr/local/share/lua/5.1/?.lua;;";
    lua_package_cpath "/usr/local/lib/lua/5.1/?.so;;";
    lua_socket_log_errors off;

    server_names_hash_max_size 2048;
    server_names_hash_bucket_size 128;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    log_format main '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" request_id="$request_id" '
        '"$host" "$upstream_addr" "$upstream_status" "$upstream_response_time"';

    access_log /dev/stdout main buffer=32k flush=5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 7;
    gzip_buffers 16 8k;
    gzip_min_length 256;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    tcp_nodelay on;

    include /usr/local/openresty/nginx/conf.d/*.conf;
}
