<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Request Error</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #070707;
                --panel: #101010;
                --panel-strong: #191919;
                --panel-soft: #0b0b0b;
                --line: rgba(255, 255, 255, 0.14);
                --line-strong: rgba(255, 255, 255, 0.24);
                --text-main: #f5f7fb;
                --text-muted: #999999;
                --text-faint: #777777;
                --accent: #8b0000;
                --grid: rgba(255, 255, 255, 0.10);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                background:
                    radial-gradient(circle at center, var(--grid) 1px, transparent 1.5px),
                    radial-gradient(ellipse 58rem 34rem at 86% -8%, color-mix(in srgb, var(--text-main) 3%, transparent), transparent 72%),
                    var(--bg);
                background-size: 30px 30px, auto, auto;
                color: var(--text-main);
                font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 30px;
            }

            .container {
                position: relative;
                background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 94%, var(--text-main)), var(--panel));
                border: 1px solid var(--line);
                border-radius: 24px;
                box-shadow:
                    0 24px 80px rgba(0, 0, 0, 0.32),
                    inset 0 1px 0 rgba(255, 255, 255, 0.06);
                padding: 30px;
                width: 610px;
                max-width: calc(100vw - 32px);
                animation: fadeIn 0.45s ease-out;
                overflow: hidden;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                margin-bottom: 26px;
            }

            .logo {
                display: grid;
                place-items: center;
                width: 78px;
                height: 78px;
                border: 1px solid var(--line-strong);
                border-radius: 18px;
                background:
                    linear-gradient(180deg, color-mix(in srgb, var(--text-main) 5%, transparent), color-mix(in srgb, var(--accent) 3%, transparent)),
                    var(--panel-soft);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            }

            .logo svg {
                width: 58px;
                height: 58px;
            }

            .brand-copy {
                min-width: 0;
            }

            .brand-name {
                color: var(--text-main);
                font-size: 1.35rem;
                font-weight: 800;
                letter-spacing: -0.025em;
                line-height: 1;
            }

            .eyebrow {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                margin-top: 12px;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: var(--panel-soft);
                color: var(--text-muted);
                font-size: 0.72rem;
                font-weight: 650;
                letter-spacing: 0.18em;
                padding: 8px 12px;
            }

            .eyebrow::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--accent);
            }

            .status-row {
                display: grid;
                grid-template-columns: 92px 1fr;
                gap: 26px;
                align-items: start;
            }

            h1 {
                align-items: center;
                background: color-mix(in srgb, var(--accent) 8%, transparent);
                border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
                border-radius: 19px;
                color: var(--text-main);
                display: flex;
                font-family: ui-monospace, "SF Mono", Menlo, monospace;
                font-size: clamp(1.75rem, 8vw, 2.55rem);
                font-weight: 600;
                justify-content: center;
                letter-spacing: -0.045em;
                line-height: 1;
                min-height: 92px;
            }

            h2 {
                color: var(--text-main);
                font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
                font-size: clamp(1.8rem, 5vw, 2.45rem);
                font-weight: 750;
                letter-spacing: -0.025em;
                line-height: 1.02;
                margin: 1px 0 14px;
            }

            p {
                color: var(--text-muted);
                font-size: 0.94rem;
                font-weight: 500;
                line-height: 1.5;
                margin: 0 0 22px;
                max-width: 330px;
            }

            a {
                align-items: center;
                border: 1px solid transparent;
                border-radius: 14px;
                display: inline-block;
                font-size: 0.9rem;
                font-weight: 650;
                justify-content: center;
                min-width: 122px;
                padding: 0.78rem 1.04rem;
                background: var(--panel-strong);
                border-color: var(--line);
                color: var(--text-main);
                text-decoration: none;
                transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
            }

            .actions {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }

            .secondary {
                background: transparent;
                border-color: var(--line);
                color: var(--text-muted);
            }

            a:hover {
                background: var(--panel-strong);
                border-color: var(--line-strong);
                transform: translateY(-1px);
            }

            .secondary:hover {
                background: var(--panel-strong);
                border-color: var(--line);
            }

            .request-id {
                color: var(--text-faint);
                font-family: ui-monospace, "SF Mono", Menlo, monospace;
                font-size: 0.68rem;
                margin: 0 0 16px;
                max-width: none;
                overflow-wrap: anywhere;
            }

            #retry-message {
                color: var(--text-faint);
                font-size: 0.84rem;
                font-weight: 500;
                margin-bottom: 16px;
            }

            footer {
                position: absolute;
                bottom: 18px;
                width: 100%;
                text-align: center;
                color: var(--text-faint);
                font-size: 0.74rem;
                font-weight: 600;
                left: 0;
                letter-spacing: 0.08em;
            }

            .hanasand-error {
                --line-strong: rgba(120, 6, 6, 0.56);
                --accent: #780606;
                background:
                    radial-gradient(ellipse 58rem 34rem at 86% -8%, rgba(255, 255, 255, 0.03), transparent 72%),
                    radial-gradient(ellipse 42rem 30rem at 8% 88%, rgba(120, 6, 6, 0.08), transparent 76%),
                    var(--bg);
            }

            .hanasand-error .container {
                background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 94%, var(--text-main)), var(--panel));
            }

            .hanasand-error .logo {
                background: linear-gradient(180deg, rgba(120, 6, 6, 0.12), rgba(255, 255, 255, 0.025)), var(--panel-soft);
            }

            .hanasand-error .logo svg {
                filter: none;
            }

            .hanasand-error h1 {
                background: rgba(120, 6, 6, 0.10);
                border-color: rgba(120, 6, 6, 0.35);
            }

            .hanasand-error a {
                background: var(--panel-strong);
                border-color: rgba(120, 6, 6, 0.40);
            }

            .hanasand-error .secondary {
                background: transparent;
                border-color: var(--line);
            }

            .hanasand-error a:hover {
                background: var(--panel-strong);
                border-color: rgba(120, 6, 6, 0.62);
            }

            .hanasand-error .secondary:hover {
                background: var(--panel-strong);
                border-color: var(--line);
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(12px) scale(0.98); }
                to { opacity: 1; transform: translateY(0); }
            }

            @media (max-width: 620px) {
                .container {
                    padding: 26px;
                }

                .status-row {
                    grid-template-columns: 1fr;
                    gap: 22px;
                }

                h1 {
                    min-height: 92px;
                }

                a {
                    flex: 1 1 140px;
                }
            }
        </style>
        <script>document.documentElement.classList.toggle('light', document.cookie.split('; ').includes('theme=light'))</script>
        <style>
            html.light {
                color-scheme: light;
                --bg: #f5f5f5;
                --panel: #ffffff;
                --panel-strong: #ededed;
                --panel-soft: #ffffff;
                --line: rgba(23, 26, 33, 0.12);
                --line-strong: rgba(23, 26, 33, 0.22);
                --text-main: #171a21;
                --text-muted: #4d4d4d;
                --text-faint: #666666;
                --grid: rgba(20, 20, 20, 0.08);
            }

            html.light body.hanasand-error {
                --line-strong: rgba(120, 6, 6, 0.40);
            }
        </style>
    </head>
    <body class="{{brand_class}}">
        <div class="container">
            <div class="brand">
                <div class="logo" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
                        <rect width="64" height="64" rx="14" fill="var(--panel-soft)"/>
                        <path d="M8 42c8-5 16-5 24 0s16 5 24 0" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
                        <path d="M15 50h34" stroke="var(--text-main)" stroke-width="4" stroke-linecap="round"/>
                        <path d="M21 50l7-18h8l7 18" fill="none" stroke="var(--text-main)" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M25 32l7-7 7 7" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M43 19v31" stroke="var(--text-main)" stroke-width="4" stroke-linecap="round"/>
                        <path d="M43 20a13 13 0 0 1 13 13" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                        <path d="M43 27a6 6 0 0 1 6 6" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="43" cy="20" r="3" fill="var(--accent)"/>
                    </svg>
                </div>
                <div class="brand-copy">
                    <div class="brand-name">Hanasand</div>
                    <div class="eyebrow" id="notice-label">Maintenance</div>
                </div>
            </div>
            <div class="status-row">
                <h1 id="status-code">500</h1>
                <div>
                    <h2 id="status-title">Internal Server Error</h2>
                    <p id="status-message">The site could not be reached. Please try again.</p>
                    <p id="retry-message"></p>
                    <p id="request-id" class="request-id">Request ID: <span></span></p>
                    <div class="actions">
                        <a id="retry-link" href="#">Try Again</a>
                        <a class="secondary" id="home-link" href="#">Go Home</a>
                    </div>
                </div>
            </div>
        </div>

        <footer>&copy; <span id="year"></span> <span id="domain"></span></footer>

        <script>
            const errors = {
                400: ['Bad Request', 'The request could not be understood by this server.'],
                401: ['Unauthorized', 'This page requires authorization before it can be viewed.'],
                403: ['Forbidden', 'You do not have access to this page.'],
                404: ['Page Not Found', 'The page you are looking for does not exist on {domain}.'],
                405: ['Method Not Allowed', 'This request method is not allowed here.'],
                406: ['Not Acceptable', 'The requested response format is not available.'],
                408: ['Request Timeout', 'The server timed out waiting for the request.'],
                409: ['Conflict', 'The request conflicts with the current state of this resource.'],
                410: ['Gone', 'This resource is no longer available.'],
                418: ["I'm a teapot", 'This endpoint refuses to brew coffee.'],
                429: ['Too Many Requests', 'Slow down and try again in a moment.'],
                451: ['Unavailable for Legal Reasons', 'This resource is unavailable for legal reasons.'],
                500: ['Internal Server Error', 'The site could not be reached. Please try again.'],
                501: ['Not Implemented', 'This feature is not implemented on this server.'],
                502: ['Bad Gateway', 'Invalid response'],
                503: ['Service Unavailable', 'The service is temporarily unavailable. Please try again soon.'],
                504: ['Gateway Timeout', 'The upstream service took too long to respond.'],
            };
            const rendered = {
                code: Number('{{code}}'),
                title: '{{title}}',
                message: '{{message}}',
                domain: '{{domain}}',
                homeUrl: '{{home_url}}',
                retryable: '{{retryable}}' === 'true',
                requestId: '{{request_id}}',
            };
            const maxRetries = 5;
            const retryBaseSeconds = 5;
            const params = new URLSearchParams(window.location.search);
            const renderedStatus = Number.isFinite(rendered.code);
            const fallbackCode = Number(params.get('code')) || 500;
            const code = renderedStatus ? rendered.code : fallbackCode;
            const [fallbackTitle, fallbackMessage] = errors[code] || errors[500];
            const fullHostname = window.location.hostname || 'hanasand.com';
            const parts = fullHostname.split('.');
            const fallbackDomain = parts.length >= 2 ? parts.slice(-2).join('.') : fullHostname;
            const domain = renderedStatus ? rendered.domain : fallbackDomain;
            const title = renderedStatus ? rendered.title : fallbackTitle;
            const message = renderedStatus ? rendered.message : fallbackMessage.replace('{domain}', domain);
            const retryable = renderedStatus ? rendered.retryable : [408, 429, 500, 502, 503, 504].includes(code);
            const retries = Math.min(Number(params.get('retries')) || 0, maxRetries);
            const homeLink = document.getElementById('home-link');
            const retryLink = document.getElementById('retry-link');
            const retryMessage = document.getElementById('retry-message');
            const retryUrl = new URL(window.location.href);

            document.title = `${code} - ${title}`;
            document.getElementById('notice-label').textContent = code >= 500 ? 'Maintenance' : 'Hanasand';
            document.getElementById('status-code').textContent = String(code);
            document.getElementById('status-title').textContent = title;
            document.getElementById('status-message').textContent = message;
            document.getElementById('domain').textContent = domain === 'hanasand.com' ? 'Hanasand' : domain;
            document.querySelector('#request-id span').textContent = rendered.requestId;
            homeLink.href = renderedStatus ? rendered.homeUrl : `https://${domain}`;
            retryUrl.searchParams.set('retries', String(retries + 1));
            retryLink.href = retryUrl.toString();
            document.getElementById('year').textContent = new Date().getFullYear();

            if (retryable && retries < maxRetries) {
                const delaySeconds = retryBaseSeconds * Math.pow(2, retries);
                retryMessage.textContent = `Retrying in ${delaySeconds}s. Attempt ${retries + 1} of ${maxRetries}.`;
                window.setTimeout(() => window.location.assign(retryLink.href), delaySeconds * 1000);
            } else if (retryable) {
                retryMessage.textContent = 'Automatic retries stopped. Try again later.';
            } else {
                retryMessage.remove();
            }
        </script>
    </body>
</html>
