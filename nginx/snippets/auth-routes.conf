# A stuck validator should fail over within the frontend's request deadline.
location ^~ /api/auth/token/ {
    proxy_pass http://hanasand_auth;
    include snippets/auth-proxy.conf;
    proxy_read_timeout 10s;
}
location ^~ /api/auth/ {
    proxy_pass http://hanasand_auth;
    include snippets/auth-proxy.conf;
    proxy_read_timeout 60s;
}
location = /api/user {
    proxy_pass http://hanasand_auth;
    include snippets/auth-proxy.conf;
    proxy_read_timeout 60s;
}
