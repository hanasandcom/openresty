server {
    listen 80;
    listen [::]:80;
    server_name 128.39.142.172;

    include snippets/errors.conf;

    location / {
        log_by_lua_file /usr/local/openresty/nginx/lua/traffic_logger.lua;
        proxy_pass http://localhost:3000;
        include snippets/proxy-headers.conf;
    }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;

    server_name logs.hanasand.com;
    ssl_certificate /etc/letsencrypt/live/hanasand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanasand.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/errors.conf;

    location = /api/ingest {
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:18090/api/ingest;
        include snippets/proxy-headers.conf;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:18090/api/health;
        include snippets/proxy-headers.conf;
    }

    location / {
        return 404;
    }
}

