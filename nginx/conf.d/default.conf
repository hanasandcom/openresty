server {
    listen 127.0.0.1:8443 ssl proxy_protocol;

    server_name hanasand.com www.hanasand.com;
    ssl_certificate /etc/letsencrypt/live/hanasand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanasand.com/privkey.pem;

    include snippets/errors.conf;

    location = /sandbox {
        return 302 https://browsers.hanasand.com/sandbox$is_args$args;
    }

    location ^~ /sandbox/ {
        return 302 https://browsers.hanasand.com$request_uri;
    }

    location /api/app {
        log_by_lua_file /usr/local/openresty/nginx/lua/traffic_logger.lua;
        proxy_pass http://127.0.0.1:8080;
        include snippets/proxy-headers.conf;
    }

    location / {
        log_by_lua_file /usr/local/openresty/nginx/lua/traffic_logger.lua;
        proxy_pass http://localhost:3000;
        include snippets/proxy-headers.conf;
    }
}


server {
    listen 127.0.0.1:8443 ssl proxy_protocol;

    server_name api.hanasand.com;
    include snippets/auth-routes.conf;
    ssl_certificate /etc/letsencrypt/live/hanasand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanasand.com/privkey.pem;

    include snippets/errors.conf;

    # Legacy collectors are sent straight to the independent Logs API.
    location = /api/logs/ingest {
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:18090/api/ingest;
        include snippets/proxy-headers.conf;
    }

    location = /api/tools/ai {
        log_by_lua_file /usr/local/openresty/nginx/lua/traffic_logger.lua;
        proxy_pass http://127.0.0.1:19182;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /api/ai {
        proxy_pass http://127.0.0.1:19182;
        include snippets/proxy-headers.conf;
    }

    location ^~ /api/ai/ {
        log_by_lua_file /usr/local/openresty/nginx/lua/traffic_logger.lua;
        proxy_pass http://127.0.0.1:19182;
        include snippets/proxy-headers.conf;
    }

    location ^~ /api/client/ws/ {
        proxy_pass http://127.0.0.1:19182;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        log_by_lua_file /usr/local/openresty/nginx/lua/traffic_logger.lua;
        proxy_pass http://127.0.0.1:8080;
        include snippets/proxy-headers.conf;
    }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;

    server_name identity.hanasand.com;
