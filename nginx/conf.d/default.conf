map $host $vm_legacy_target {
    ~^([a-z0-9-]+-[a-z0-9-]+-[a-z0-9-]+)\.hanasand\.com$ http://$1.lxd:80;
    default "";
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;

    server_name *.hanasand.com;

    ssl_certificate /etc/letsencrypt/live/hanasand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanasand.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/errors.conf;
    resolver 10.119.85.1 valid=10s ipv6=off;

    set_by_lua_block $vm_target {
        local host = ngx.var.host and ngx.var.host:lower() or ""
        return ngx.shared.vm_http_routes:get(host) or ngx.var.vm_legacy_target
    }

    if ($vm_target = "") {
        return 301 https://hanasand.com$request_uri;
    }

    location / {
        log_by_lua_file /usr/local/openresty/nginx/lua/traffic_logger.lua;
        include snippets/proxy-headers.conf;
        proxy_pass $vm_target;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }
}
