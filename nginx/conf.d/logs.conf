server {
    listen 127.0.0.1:8443 ssl proxy_protocol;

    server_name logs.hanasand.com;
    ssl_certificate /etc/letsencrypt/live/hanasand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanasand.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/errors.conf;

    location = /api/ingest {
        client_max_body_size 512k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/ingest;
        include snippets/proxy-headers.conf;
    }

    location = /api/organizations/sync {
        client_max_body_size 16m;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/organizations/sync;
        include snippets/proxy-headers.conf;
    }

    location = /api/health {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/health;
        include snippets/proxy-headers.conf;
    }

    # Customer reads go straight to the Logs API. Its handlers validate the
    # caller with Identity and enforce the active organization membership.
    location = /api/organizations {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/organizations;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/search {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/search;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/realtime {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/realtime;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/services {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/services;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/services/summary {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/services/summary;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/metrics {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/metrics;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/metrics/public {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/metrics/public;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/tuning {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/tuning;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/tuning/refresh {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/tuning/refresh;
        include snippets/proxy-headers.conf;
    }

    location = /api/logs/errors {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/logs/errors;
        include snippets/proxy-headers.conf;
    }

    location = /api/rules/hits {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/rules/hits;
        include snippets/proxy-headers.conf;
    }

    location ~ ^/api/rules/([^/]+)/hits$ {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/rules/$1/hits;
        include snippets/proxy-headers.conf;
    }

    location ~ ^/api/rules/([^/]+)/storage-estimate$ {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/rules/$1/storage-estimate;
        include snippets/proxy-headers.conf;
    }

    # Migration bridge endpoints are public only as exact POST paths. The API
    # validates LOGS_SERVICE_SYNC_TOKEN; this proxy allowlist prevents unrelated
    # API paths from becoming externally reachable.
    location = /api/migration/status {
        client_max_body_size 512k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/migration/status;
        include snippets/proxy-headers.conf;
    }

    location = /api/migration/findings {
        client_max_body_size 512k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/migration/findings;
        include snippets/proxy-headers.conf;
    }

    location = /api/migration/findings/verify {
        client_max_body_size 512k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/migration/findings/verify;
        include snippets/proxy-headers.conf;
    }

    location = /api/migration/receipts {
        client_max_body_size 512k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/migration/receipts;
        include snippets/proxy-headers.conf;
    }

    location = /api/migration/linkage-archive {
        client_max_body_size 512k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/migration/linkage-archive;
        include snippets/proxy-headers.conf;
    }

    location = /api/migration/state {
        client_max_body_size 512k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/migration/state;
        include snippets/proxy-headers.conf;
    }

    location = /api/migration/projection {
        client_max_body_size 512k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:18091/api/migration/projection;
        include snippets/proxy-headers.conf;
    }

    location / {
        return 404;
    }
}
